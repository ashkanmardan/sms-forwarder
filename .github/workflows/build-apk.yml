name: Android checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Clean
        run: ./gradlew clean
      - name: Lint
        run: ./gradlew lint
      - name: Unit tests
        run: ./gradlew test
      - name: Debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
